<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK TIM LOCAL — Томск</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',Arial,sans-serif}
body{background:#f5f5f7;color:#111}.gold{color:#d4af37}
.hd{background:#0a0a0a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.hd b{font-size:18px;letter-spacing:1px;cursor:pointer}
.hd a{color:#999;font-size:12px;margin-left:14px;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.hero{text-align:center;padding:40px 10px}
.hero h1{font-size:32px;font-weight:800}.hero p{color:#666;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.06);cursor:pointer;position:relative}
.card .av{width:70px;height:70px;border-radius:50%;border:2px solid #d4af37;margin:0 auto 10px;background:#222 center/cover}
.card h3{font-size:16px}.card .st{color:#d4af37;font-size:13px;margin:4px 0}.card .pr{color:#555;font-size:13px}
.tag{position:absolute;top:10px;right:10px;background:#0a0a0a;color:#fff;font-size:10px;padding:3px 8px;border-radius:10px}
.hidden{display:none}
.badge{display:inline-block;background:#d4af37;color:#000;font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700}
.msg{font-size:13px;margin-top:8px}
.inp{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:14px;margin:6px 0}
.cta{background:var(--acc,#d4af37);color:var(--acct,#000);border:none;border-radius:24px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer}
.ghost{background:transparent;color:var(--htext,#fff);border:1px solid var(--acc,#d4af37);border-radius:24px;padding:12px 22px;font-size:14px;cursor:pointer}
#masterView{--bg:#f5f5f7;--card:#fff;--text:#111;--mut:#666;--line:#eee;--head:#0a0a0a;--htext:#fff;--acc:#d4af37;--acct:#000;background:var(--bg);min-height:100vh}
#masterView.theme-minimal{--bg:#fff;--card:#fff;--text:#111;--mut:#888;--line:#e5e5e5;--head:#fff;--htext:#111}
#masterView.theme-neon{--bg:#0b0b14;--card:#161624;--text:#eef;--mut:#99a;--line:#2a2a3d;--head:#0b0b14;--htext:#eef}
#masterView.theme-craft{--bg:#f3ede4;--card:#fffcf7;--text:#3b2f23;--mut:#8a7a66;--line:#e4daca;--head:#3b2f23;--htext:#f6efe4}
.pf{background:var(--head);color:var(--htext);border-radius:0 0 20px 20px;padding:50px 20px 30px;text-align:center}
.pf .av{width:100px;height:100px;border-radius:50%;border:3px solid var(--acc);margin:0 auto 12px;background:#333 center/cover}
.pf h1{font-size:24px}
.pf .role{font-size:13px;margin:4px 0;opacity:.75}
.rate{color:var(--acc);font-weight:600;margin-top:4px}
.panel{background:var(--card);color:var(--text);border-radius:16px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:16px;animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel h2{font-size:16px;margin-bottom:12px;color:var(--text)}
.svc{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.svc b{font-family:monospace;color:var(--acc)}
#mDesc{color:var(--mut);font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:11px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:998;align-items:center;justify-content:center}
#lb img{max-width:92%;max-height:92%;border-radius:12px}
.rev{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.rev .au{font-weight:700}.rev .rt{color:var(--acc)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:16px 0}
.story-circle{min-width:70px;text-align:center;cursor:pointer}
.story-circle .ring{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888);margin:0 auto 4px}
.story-circle .img{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:#ddd center/cover}
.story-circle .cap{font-size:10px;color:var(--mut);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-viewer{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column}
.story-viewer.active{display:flex}
.story-header{position:absolute;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);z-index:4}
.story-progress{display:flex;gap:4px;margin-bottom:8px}
.story-progress .bar{flex:1;height:2px;background:rgba(255,255,255,.3);border-radius:1px;overflow:hidden}
.story-progress .bar .fill{height:100%;background:#fff;width:0}
.story-info{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
.story-info .av{width:32px;height:32px;border-radius:50%;background:#333 center/cover}
.story-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;z-index:5}
.story-content{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.story-content img{max-width:100%;max-height:100%;object-fit:contain}
.story-caption{position:absolute;bottom:80px;left:0;right:0;text-align:center;color:#fff;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.tz{position:absolute;top:0;bottom:0;width:40%;z-index:3;cursor:pointer}
.tz.l{left:0}.tz.r{right:0}
</style>
</head>
<body>
<div class="hd"><b onclick="showList()">BLACK TIM <span class="gold">LOCAL</span></b><span><a href="admin.html">Кабинет мастера</a></span></div>

<div id="listView" class="wrap">
 <div class="hero"><h1>НАЙДИ СВОЕГО МАСТЕРА В ТОМСКЕ</h1><p>Проверенные профили · Реальные отзывы · Запись 24/7</p></div>
 <div class="grid" id="grid"></div>
</div>

<div id="masterView" class="hidden">
 <div class="pf"><div class="av" id="mAv"></div>
  <h1 id="mName"></h1><div class="role" id="mRole"></div><div class="rate" id="mRate"></div>
  <div style="margin-top:14px"><button class="cta" onclick="bookForm.scrollIntoView()">ЗАПИСАТЬСЯ ОНЛАЙН</button> <button class="ghost" id="mWa">WhatsApp</button> <button class="ghost" onclick="share()">Поделиться</button></div>
 </div>
 <div class="wrap">
  <div class="panel" id="storiesPanel" style="display:none"><div class="stories" id="storiesRow"></div></div>
  <div class="panel" id="galPanel" style="display:none"><h2>РАБОТЫ МАСТЕРА</h2><div class="gal" id="galRow"></div></div>
  <div class="panel"><h2>УСЛУГИ И ЦЕНЫ</h2><div id="mSvcs"></div></div>
  <div class="panel"><h2>О МАСТЕРЕ</h2><p id="mDesc"></p></div>
  <div class="panel"><h2>ОТЗЫВЫ</h2><div id="mRevs"></div>
   <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
    <input class="inp" id="revName" placeholder="Ваше имя">
    <input class="inp" id="revText" placeholder="Ваш отзыв">
    <select class="inp" id="revRate"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option></select>
    <button class="cta" onclick="sendReview()">Оставить отзыв</button>
    <p id="revMsg" class="msg"></p></div></div>
  <div class="panel" id="bookForm"><h2>ЗАПИСЬ ОНЛАЙН</h2>
   <input class="inp" id="bName" placeholder="Ваше имя">
   <input class="inp" id="bPhone" placeholder="Ваш телефон">
   <input class="inp" id="bDate" type="date">
   <button class="cta" onclick="sendBooking()">ОТПРАВИТЬ ЗАЯВКУ</button>
   <p id="bMsg" class="msg"></p></div>
  <div class="panel foot">Работает на BLACK TIM LOCAL™</div>
 </div>
</div>

<div id="lb" onclick="lb.style.display='none'"><img id="lbImg"></div>

<div class="story-viewer" id="storyViewer">
 <div class="story-header">
  <div class="story-progress" id="storyProgress"></div>
  <div class="story-info"><div class="av" id="svAv"></div><span id="svName"></span></div>
 </div>
 <button class="story-close" onclick="closeViewer()">×</button>
 <div class="story-content">
  <div class="tz l" onclick="prevStory()"></div>
  <div class="tz r" onclick="nextStory()"></div>
  <img id="svImg" src="">
  <div class="story-caption" id="svCap"></div>
 </div>
</div>

<script>
const getM=()=>JSON.parse(localStorage.getItem('blacktim_masters')||'[]');
const setM=a=>localStorage.setItem('blacktim_masters',JSON.stringify(a));
const getS=()=>JSON.parse(localStorage.getItem('blacktim_services')||'[]');
const getB=()=>JSON.parse(localStorage.getItem('blacktim_bookings')||'[]');
const getSt=()=>JSON.parse(localStorage.getItem('blacktim_stories')||'[]');
const getG=()=>JSON.parse(localStorage.getItem('blacktim_gallery')||'[]');
const getR=()=>JSON.parse(localStorage.getItem('blacktim_reviews')||'[]');
const DEFACC={blackgold:'#d4af37',minimal:'#111111',neon:'#22d3ee',craft:'#b0713a'};
let cur=null,stories=[],curIdx=0,storyTimer=null;
function lum(hex){const c=hex.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
function renderList(){
 const ms=getM().filter(m=>m.status==='active');
 grid.innerHTML=ms.length?ms.map(m=>`<div class="card" onclick="showMaster(${m.id})"><span class="tag">Томск</span><div class="av" style="background-image:url('${m.avatar||''}')"></div><h3>${m.name}</h3><div class="st">★★★★★ ${m.rating||'5.0'}</div><div class="pr">${m.price_from?'от '+m.price_from+' ₽':'цена по запросу'}</div>${m.plan==='pro'?'<div style="margin-top:6px"><span class="badge">PRO</span></div>':''}</div>`).join(''):'<p style="color:#888">Пока нет мастеров — добавь первого в super.html</p>';
}
function showMaster(id){
 const all=getM();cur=all.find(m=>m.id===id);if(!cur)return;
 cur.views=(cur.views||0)+1;setM(all);
 const t=cur.template||'blackgold';
 masterView.className='theme-'+t;
 const a=cur.accent||DEFACC[t]||'#d4af37';
 masterView.style.setProperty('--acc',a);
 masterView.style.setProperty('--acct',lum(a)>0.55?'#000':'#fff');
 listView.classList.add('hidden');
 mAv.style.backgroundImage=cur.avatar?`url('${cur.avatar}')`:'';
 mName.textContent=cur.name;
 mRole.textContent=(cur.category||'Мастер')+' · Томск · '+cur.views+' просмотров';
 mRate.textContent='★★★★★ '+(cur.rating||'5.0')+' ('+(cur.reviews||0)+' отзывов)';
 mDesc.textContent=cur.description||'Описание скоро появится.';
 mWa.onclick=()=>location.href='https://wa.me/'+(cur.whatsapp||'');
 const sv=getS().filter(s=>s.master_id===id);
 mSvcs.innerHTML=sv.length?sv.map(s=>`<div class="svc"><span>${s.name}</span><b>${s.price} ₽</b></div>`).join(''):'<p style="color:#888">Услуги скоро появятся</p>';
 const g=getG().filter(x=>x.master_id===id);
 galPanel.style.display=g.length?'block':'none';
 galRow.innerHTML=g.map(x=>`<img src="${x.image}" title="${x.caption||''}" onclick="lbOpen('${x.image}')">`).join('');
 const rv=getR().filter(x=>x.master_id===id&&x.status==='ok');
 mRevs.innerHTML=rv.length?rv.map(x=>`<div class="rev"><span class="au">${x.author}</span> <span class="rt">${'★'.repeat(x.rating)}</span><br>${x.text}</div>`).join(''):'<p style="color:#888">Отзывов пока нет — будьте первым!</p>';
 stories=getSt().filter(s=>s.master_id===id);
 storiesPanel.style.display=stories.length?'block':'none';
 if(stories.length)storiesRow.innerHTML=stories.map((s,i)=>`<div class="story-circle" onclick="openViewer(${i})"><div class="ring"><div class="img" style="background-image:url('${s.image}')"></div></div><div class="cap">${s.caption||'История'}</div></div>`).join('');
 scrollTo(0,0);
}
function lbOpen(src){lbImg.src=src;lb.style.display='flex';}
function showList(){masterView.classList.add('hidden');listView.classList.remove('hidden');renderList();}
function share(){
 const url=location.href.split('#')[0]+'#m'+cur.id;
 if(navigator.share){navigator.share({title:cur.name,text:'Страница мастера на Black Tim Local',url});}
 else{navigator.clipboard.writeText(url).then(()=>alert('✅ Ссылка скопирована — отправляй кому хочешь!'));}
}
function sendReview(){
 const n=revName.value,t=revText.value;
 if(!n||!t){revMsg.textContent='Заполни имя и текст';return;}
 const r=getR();r.push({id:Date.now(),master_id:cur.id,author:n,text:t,rating:+revRate.value,status:'pending'});
 localStorage.setItem('blacktim_reviews',JSON.stringify(r));
 revMsg.textContent='✅ Отзыв отправлен и появится после модерации';
 revName.value='';revText.value='';
}
function sendBooking(){
 const n=bName.value,p=bPhone.value,d=bDate.value;
 if(!n||!p||!d){bMsg.textContent='Заполни все поля';return;}
 const b=getB();b.push({id:Date.now(),master_id:cur.id,client_name:n,client_phone:p,date:d,status:'new'});
 localStorage.setItem('blacktim_bookings',JSON.stringify(b));
 bMsg.textContent='✅ Заявка отправлена! Она уже в кабинете мастера.';
 bName.value='';bPhone.value='';
}
function openViewer(idx){curIdx=idx;storyViewer.classList.add('active');svName.textContent=cur.name;svAv.style.backgroundImage=cur.avatar?`url('${cur.avatar}')`:'';showStory();}
function showStory(){
 if(curIdx<0||curIdx>=stories.length){closeViewer();return;}
 const s=stories[curIdx];
 svImg.src=s.image;svCap.textContent=s.caption||'';
 storyProgress.innerHTML=stories.map((_,i)=>`<div class="bar"><div class="fill" id="bar${i}"></div></div>`).join('');
 clearInterval(storyTimer);let pct=0;
 storyTimer=setInterval(()=>{pct+=2;const el=document.getElementById('bar'+curIdx);if(el)el.style.width=pct+'%';if(pct>=100){clearInterval(storyTimer);nextStory();}},100);
}
function nextStory(){curIdx++;showStory();}
function prevStory(){curIdx--;showStory();}
function closeViewer(){storyViewer.classList.remove('active');clearInterval(storyTimer);}
document.addEventListener('keydown',e=>{if(!storyViewer.classList.contains('active'))return;if(e.key==='ArrowRight')nextStory();if(e.key==='ArrowLeft')prevStory();if(e.key==='Escape')closeViewer();});
renderList();
if(location.hash.startsWith('#m')){const id=parseInt(location.hash.slice(2));if(id)showMaster(id);}
</script>
</body>
</html>
